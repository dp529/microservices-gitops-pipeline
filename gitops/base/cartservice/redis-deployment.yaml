# redis-cart is a backing dependency of cartservice, not one of the ten
# application services. It is bundled here so cartservice remains a single
# deployable unit. Environment overlays can still size it independently.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-cart
spec:
  selector:
    matchLabels:
      app: redis-cart
  template:
    metadata:
      labels:
        app: redis-cart
    spec:
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: redis
          # Pinned to an immutable digest, resolved from the public registry
          # for redis:7.4-alpine. A bare tag such as `redis:alpine` is
          # mutable: the same git commit could deploy a different Redis
          # version on a later reconcile, which breaks the guarantee that
          # git describes what is running.
          #
          # This is not promoted by CI - redis is a backing dependency of
          # cartservice, not one of the ten application services - so it is
          # updated deliberately by editing this line.
          image: redis@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
          ports:
            - containerPort: 6379
          readinessProbe:
            periodSeconds: 5
            tcpSocket:
              port: 6379
          livenessProbe:
            periodSeconds: 5
            tcpSocket:
              port: 6379
          volumeMounts:
            - name: redis-data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 70m
              memory: 200Mi
            limits:
              cpu: 125m
              memory: 256Mi
      volumes:
        - name: redis-data
          emptyDir: {}
