# redis-cart is a backing dependency of cartservice, not one of the ten
# application services. It is bundled here so cartservice remains a single
# deployable unit. Environment overlays can still size it independently.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-cart
spec:
  selector:
    matchLabels:
      app: redis-cart
  template:
    metadata:
      labels:
        app: redis-cart
    spec:
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: redis
          # MUTABLE TAG - not an immutable pin. Anyone can publish a new
          # image under `redis:alpine`, so two deploys of this same commit
          # can land different Redis versions. Acceptable for this lab.
          # BEFORE PRODUCTION: replace with an explicit digest, e.g.
          #   image: redis@sha256:<digest>
          # See docs/deployable-units.md, "Known deviations".
          image: redis:alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            periodSeconds: 5
            tcpSocket:
              port: 6379
          livenessProbe:
            periodSeconds: 5
            tcpSocket:
              port: 6379
          volumeMounts:
            - name: redis-data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 70m
              memory: 200Mi
            limits:
              cpu: 125m
              memory: 256Mi
      volumes:
        - name: redis-data
          emptyDir: {}
