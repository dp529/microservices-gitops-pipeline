apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: boutique-dev

resources:
  - ../../../base/shippingservice

# CI replaces newTag with an immutable digest (Phase 6). The same digest
# is promoted dev -> staging -> prod; only namespace, replicas and
# resources differ between environments.
images:
  - name: shippingservice
    newName: shippingservice
    newTag: dev-placeholder

replicas:
  - name: shippingservice
    count: 1
