apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: boutique-prod

resources:
  - ../../../base/paymentservice

# CI replaces newTag with an immutable digest (Phase 6). The same digest
# is promoted dev -> staging -> prod; only namespace, replicas and
# resources differ between environments.
images:
  - name: paymentservice
    newName: paymentservice
    newTag: prod-placeholder

replicas:
  - name: paymentservice
    count: 3
