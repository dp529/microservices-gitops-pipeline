apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: boutique-staging

resources:
  - ../../../base/currencyservice

# CI replaces newTag with an immutable digest (Phase 6). The same digest
# is promoted dev -> staging -> prod; only namespace, replicas and
# resources differ between environments.
images:
  - name: currencyservice
    newName: currencyservice
    newTag: staging-placeholder

replicas:
  - name: currencyservice
    count: 2
