apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: boutique-staging

resources:
  - ../../../base/cartservice

# CI replaces newTag with an immutable digest (Phase 6).
images:
  - name: cartservice
    newName: cartservice
    newTag: staging-placeholder

# redis-cart is a bundled backing dependency, not one of the ten
# application services. It is sized per environment but never promoted
# by CI, so its image is pinned in the base and not listed above.
replicas:
  - name: cartservice
    count: 2
  - name: redis-cart
    count: 1

patches:
  - path: redis-resources.yaml
