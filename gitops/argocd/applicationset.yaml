apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: boutique
  namespace: argocd
spec:
  # Go templating. Every expression below therefore uses the Go form with a
  # leading dot ({{.environment}}) rather than the legacy fasttemplate form
  # (the same name with no dot). Under Go templating the git generator
  # exposes `path` as an object, so the directory is {{.path.path}} and its
  # last element is {{.path.basename}}.
  goTemplate: true

  # Surface a missing key as an error at render time instead of silently
  # substituting "<no value>" into a field.
  goTemplateOptions:
    - missingkey=error

  # Keep generated Applications when this ApplicationSet is deleted, rather
  # than cascading a delete across every environment at once.
  syncPolicy:
    preserveResourcesOnDeletion: true

  # =====================================================================
  # MATRIX: environments (explicit) x services (discovered)
  #
  # The two generators are deliberately different in kind:
  #
  #   - Environments are a LIST. There are exactly three, they carry
  #     per-environment settings, and a fourth should never appear by
  #     accident because someone added a directory.
  #
  #   - Services are DISCOVERED by a git directory generator. Service
  #     names are never written down here. Adding
  #     gitops/overlays/*/newservice/ creates its Applications; deleting
  #     the directories removes them.
  #
  # The matrix takes the cross product: 3 environments x 10 discovered
  # services = 30 Applications. Parameters from the first child generator
  # are available to the second, which is how the git generator scans the
  # directory of the environment currently being expanded.
  # =====================================================================
  generators:
    - matrix:
        generators:
          # ---------------------------------------------------------------
          # Generator 1 - environments, explicit.
          #
          # Every environment-specific value lives here. `prune` is a
          # string on purpose: generator parameters are strings, and it is
          # consumed by the templatePatch below rather than being written
          # straight into a boolean field. See the note on templatePatch.
          # ---------------------------------------------------------------
          - list:
              elements:
                - environment: dev
                  namespace: boutique-dev
                  # PLACEHOLDER - no external clusters registered yet.
                  # Becomes the dev EKS cluster's API server URL.
                  destinationServer: https://kubernetes.default.svc
                  # Dev tracks the mainline. A merge to main reaches dev
                  # without a promotion PR.
                  revision: main
                  prune: "true"

                - environment: staging
                  namespace: boutique-staging
                  destinationServer: https://kubernetes.default.svc
                  revision: main
                  prune: "true"

                - environment: prod
                  namespace: boutique-prod
                  destinationServer: https://kubernetes.default.svc
                  revision: main
                  # Prod does not prune. A resource disappearing from the
                  # rendered output is reported as OutOfSync rather than
                  # deleted, so an accidental removal in Git does not
                  # silently tear down a running workload.
                  prune: "false"

          # ---------------------------------------------------------------
          # Generator 2 - services, discovered from the repository.
          #
          # {{.environment}} comes from the list generator above, so this
          # scans the directories that actually exist inside the
          # environment being generated. No service name appears anywhere
          # in this file.
          # ---------------------------------------------------------------
          - git:
              repoURL: https://github.com/dp529/microservices-gitops-pipeline.git
              revision: main
              directories:
                - path: gitops/overlays/{{.environment}}/*

  # =====================================================================
  # TEMPLATE - one Application per (environment, service) pair.
  #
  # Only string fields are templated here. Booleans that differ per
  # environment are set by the templatePatch below, because Go templating
  # substitutes into strings: writing prune: "{{.prune}}" would place the
  # string "false" where the CRD requires a boolean.
  # =====================================================================
  template:
    metadata:
      # <service>-<environment>, where <service> is the discovered
      # directory name. No service is named anywhere in this file.
      name: "{{.path.basename}}-{{.environment}}"
      labels:
        app.kubernetes.io/name: "{{.path.basename}}"
        app.kubernetes.io/part-of: boutique
        boutique.env: "{{.environment}}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: boutique

      source:
        # Must match sourceRepos in project.yaml.
        repoURL: https://github.com/dp529/microservices-gitops-pipeline.git
        targetRevision: "{{.revision}}"
        # Under Go templating the git generator's `path` is an object;
        # `.path.path` is the directory relative to the repository root.
        path: "{{.path.path}}"

      destination:
        server: "{{.destinationServer}}"
        # The overlay already sets this namespace. Declaring it here too
        # means a mismatch between the two is caught by the AppProject
        # destination allow-list instead of deploying somewhere unintended.
        namespace: "{{.namespace}}"

      # -----------------------------------------------------------------
      # Sync policy.
      #
      # All three environments automate. The promotion gate is the Git
      # change itself: a digest reaches staging or prod only through a
      # promotion PR. Requiring a manual Argo sync on top of an approved,
      # merged PR would be a second approval for a decision already made,
      # and would leave the cluster knowingly diverged from Git meanwhile.
      #
      # selfHeal is true everywhere and is written literally, since it does
      # not vary. prune varies per environment and is applied by
      # templatePatch.
      # -----------------------------------------------------------------
      syncPolicy:
        automated:
          selfHeal: true
          # Do not sync while the target revision is missing or the repo is
          # unreachable; leave the last good state running.
          allowEmpty: false
        syncOptions:
          - CreateNamespace=true
          - RespectIgnoreDifferences=true
          - ApplyOutOfSyncOnly=true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m

      # -----------------------------------------------------------------
      # Ignore replica drift caused by an autoscaler.
      #
      # Nothing autoscales these workloads yet. The rule is present because
      # the moment an HPA is added, Argo CD and the HPA would otherwise
      # fight over spec.replicas indefinitely.
      # -----------------------------------------------------------------
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas

  # =====================================================================
  # templatePatch - environment-specific BOOLEAN fields.
  #
  # Go templating operates on strings, so a boolean field cannot be
  # templated in the `template` block above: prune: "{{.prune}}" yields the
  # string "false", which is not a boolean and, being non-empty, reads as
  # true to anything doing a truthiness check - the exact inverse of what
  # prod wants.
  #
  # templatePatch is evaluated as a Go template producing YAML, which is
  # then merged over the rendered Application. Because the template output
  # is parsed as YAML *after* substitution, `prune: true` here is a real
  # boolean, not a quoted string.
  #
  # The conditional is written on the environment name rather than on the
  # parameter string so the intent is legible: prod does not prune.
  # =====================================================================
  templatePatch: |
    spec:
      syncPolicy:
        automated:
          selfHeal: true
          {{- if eq .environment "prod" }}
          prune: false
          {{- else }}
          prune: true
          {{- end }}
